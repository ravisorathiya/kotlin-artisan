<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{APP_NAME}} · ai workspace</title>
  <meta name="description" content="{{APP_NAME}}'s ai workspace as a site: features, releases, coming soon and requests for everyone; workflow, plans, events, assets and work reports for devs and agents. Local only, never shipped.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // The app's primary colour. Change it here; the whole site's brand scale is built from it.
    window.BRAND = '{{PRIMARY}}';

    // Theme before first paint: saved choice, else the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('ai-site-theme'); } catch (e) {}
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    })();

    // 50…950 scale around BRAND (500): mixed toward white above, toward black below.
    window.brandScale = function (hex) {
      var n = parseInt(hex.replace('#', ''), 16), rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
      var mix = function (to, w) { return '#' + rgb.map(function (c) { return Math.round(c + (to - c) * w).toString(16).padStart(2, '0'); }).join(''); };
      return { 50: mix(255, .95), 100: mix(255, .88), 200: mix(255, .74), 300: mix(255, .56), 400: mix(255, .28), 500: hex,
               600: mix(0, .12), 700: mix(0, .26), 800: mix(0, .4), 900: mix(0, .55), 950: mix(0, .7) };
    };
    document.documentElement.style.setProperty('--brand-rgb', (function (h) { var n = parseInt(h.slice(1), 16); return (n >> 16 & 255) + ' ' + (n >> 8 & 255) + ' ' + (n & 255); })(window.BRAND));
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
          colors: {
            brand: window.brandScale(window.BRAND),
            ink: { 50: '#FAF8F7', 100: '#F1EEEC', 200: '#E3DEDB', 700: '#2A2423', 800: '#1C1817', 900: '#141110', 950: '#0B0909' }
          },
          boxShadow: {
            glow: '0 18px 50px -18px rgb(var(--brand-rgb) / .55)',
            soft: '0 1px 2px rgba(20,17,16,.04), 0 8px 24px -12px rgba(20,17,16,.12)'
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
      body { @apply bg-ink-50 text-ink-900 antialiased font-sans overflow-x-hidden; }
      html.dark body { @apply bg-ink-950 text-ink-100; }
      ::selection { background: rgb(var(--brand-rgb) / .25); }
      html.dark { color-scheme: dark; }
      .grid > * { min-width: 0; }
    }
    @layer components {
      .card { @apply rounded-3xl bg-white dark:bg-ink-900 ring-1 ring-black/5 dark:ring-white/10 shadow-soft; }
      .card-sm { @apply rounded-2xl bg-white dark:bg-ink-900 ring-1 ring-black/5 dark:ring-white/10 shadow-soft; }
      .muted { @apply text-ink-900/60 dark:text-white/55; }
      .faint { @apply text-ink-900/45 dark:text-white/40; }
      .eyebrow { @apply text-sm font-semibold text-brand-500; }
      .h-page { @apply text-3xl sm:text-4xl font-extrabold tracking-tight; }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition disabled:opacity-40 disabled:pointer-events-none; }
      .btn-primary { @apply btn bg-brand-500 hover:bg-brand-600 text-white shadow-glow hover:-translate-y-0.5; }
      .btn-ghost { @apply btn bg-white dark:bg-white/5 ring-1 ring-black/10 dark:ring-white/10 hover:ring-brand-500/50; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-medium ring-1 ring-black/5 dark:ring-white/10 bg-white dark:bg-ink-900; }
      .pill { @apply shrink-0 inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full ring-1 transition ring-black/10 dark:ring-white/15 hover:ring-brand-500; }
      .pill-on { @apply bg-ink-900 text-white ring-ink-900 dark:bg-white dark:text-ink-900 dark:ring-white; }
      .input { @apply w-full rounded-xl bg-white dark:bg-ink-900 ring-1 ring-black/10 dark:ring-white/10 px-3.5 py-2.5 text-sm outline-none transition focus:ring-2 focus:ring-brand-500 placeholder:text-ink-900/35 dark:placeholder:text-white/30; }
      .label { @apply block text-sm font-semibold mb-1.5; }
      .kbd { @apply text-[10px] font-semibold px-1.5 py-0.5 rounded bg-ink-100 dark:bg-white/10; }
      .row-link { @apply flex items-center gap-3 rounded-xl px-2.5 py-2 hover:bg-ink-50 dark:hover:bg-white/[.04] transition; }
      .md-body { @apply prose prose-sm sm:prose-base max-w-none dark:prose-invert prose-headings:font-extrabold prose-headings:tracking-tight prose-headings:scroll-mt-24 prose-a:text-brand-600 dark:prose-a:text-brand-400 prose-a:no-underline hover:prose-a:underline prose-code:before:content-none prose-code:after:content-none prose-code:font-mono prose-code:text-[0.85em] prose-code:bg-ink-100 dark:prose-code:bg-white/10 prose-code:px-1 prose-code:py-0.5 prose-code:rounded prose-pre:rounded-2xl prose-img:rounded-xl prose-table:text-sm prose-th:text-left prose-blockquote:border-brand-500; }
      .md-body table { @apply block overflow-x-auto; }
      .md-body pre { @apply bg-ink-100 text-ink-900 ring-1 ring-black/5 dark:bg-black/40 dark:text-ink-100 dark:ring-white/10; }
      .md-body pre code { @apply bg-transparent dark:bg-transparent p-0 rounded-none; font-size: inherit; color: inherit; }
      .md-body .md-path { @apply font-mono text-[0.85em] text-ink-900/70 dark:text-white/60 cursor-help; }
      .md-body .task-list-item { @apply list-none -ml-5; }
      .md-body .task-list-item input { @apply mr-2 accent-brand-500; }
    }
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .dots { background-image: radial-gradient(rgba(20,17,16,.09) 1px, transparent 1px); background-size: 22px 22px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%); }
    html.dark .dots { background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); }
    .acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
    .acc.open { grid-template-rows: 1fr; }
    .acc > div { overflow: hidden; }
    .page { animation: page-in .22s ease both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .ping-ring { animation: ping-ring 2s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping-ring { 0% { box-shadow: 0 0 0 0 rgb(var(--brand-rgb) / .45); } 80%,100% { box-shadow: 0 0 0 9px rgb(var(--brand-rgb) / 0); } }
    .flash { animation: flash 2.2s ease; }
    @keyframes flash { 0%,40% { box-shadow: 0 0 0 3px rgb(var(--brand-rgb) / .7); } 100% { box-shadow: 0 0 0 0 rgb(var(--brand-rgb) / 0); } }
    .shine { background: linear-gradient(110deg, rgb(var(--brand-rgb)) 20%, rgb(var(--brand-rgb) / .45) 45%, rgb(var(--brand-rgb)) 70%); background-size: 200% 100%;
             -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
    @keyframes shine { to { background-position: -200% 0; } }
    .liquid { background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(22px) saturate(200%); backdrop-filter: blur(22px) saturate(200%);
              box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 0 0 .5px rgba(20,17,16,.1), 0 18px 40px -12px rgba(20,17,16,.35); }
    html.dark .liquid { background: rgba(30,26,25,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 .5px rgba(0,0,0,.6), 0 18px 40px -12px rgba(0,0,0,.7); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script type="module" src="./site/app.js"></script>
</head>
<body x-data="site" x-cloak>

<!-- ================= Header ================= -->
<header class="sticky top-0 z-40 backdrop-blur-xl border-b transition-all duration-300"
        :class="scrolled || route.dev ? 'bg-ink-50/90 dark:bg-ink-950/90 border-black/10 dark:border-white/10' : 'bg-ink-50/60 dark:bg-ink-950/60 border-transparent'">
  <nav class="mx-auto px-4 h-14 flex items-center gap-1" :class="route.dev ? 'max-w-[1400px]' : 'max-w-6xl'">
    <a href="#/" class="group flex items-center gap-2 font-bold mr-2 shrink-0" aria-label="Home">
      <span class="w-8 h-8 rounded-xl bg-brand-500 text-white grid place-items-center text-sm font-black shadow-glow transition-transform duration-300 group-hover:-rotate-6" x-text="(c.app.name || 'A').charAt(0).toUpperCase()"></span>
      <span class="hidden min-[400px]:inline" x-text="c.app.name"></span>
    </a>

    <div x-show="!route.dev" class="hidden md:flex items-center ml-2">
      <template x-for="l in [{ to: '#/', label: 'Home', v: 'home' }, { to: '#/releases', label: 'Releases', v: 'releases', ver: true }, { to: '#/soon', label: 'Coming soon', v: 'soon', count: c.coming.length }, { to: '#/request', label: 'Request', v: 'request' }]" :key="l.v">
        <a :href="l.to" class="relative flex items-center gap-1.5 px-3 h-9 rounded-lg text-sm transition-colors"
           :class="is(l.v) ? 'text-ink-900 dark:text-white font-semibold bg-black/5 dark:bg-white/[.07]' : 'text-ink-900/65 dark:text-white/65 hover:text-ink-900 dark:hover:text-white'">
          <span x-text="l.label"></span>
          <span x-show="l.ver" class="inline-flex items-center gap-1 text-[10px] font-bold leading-none px-1.5 py-1 rounded-md bg-brand-500 text-white">
            <span x-show="c.latest.status === 'in-progress'" class="w-1.5 h-1.5 rounded-full bg-white ping-ring"></span><span x-text="'v' + c.latest.version"></span>
          </span>
          <span x-show="l.count" class="min-w-[18px] h-[18px] px-1 grid place-items-center text-[10px] font-bold rounded-full bg-ink-900 text-white dark:bg-white dark:text-ink-900" x-text="l.count"></span>
        </a>
      </template>
    </div>

    <div x-show="route.dev" class="hidden md:flex items-center gap-2 ml-2 text-sm">
      <span class="faint">/</span><a href="#/dev" class="font-semibold hover:text-brand-500">Dev workspace</a>
    </div>

    <div class="ml-auto flex items-center gap-1.5">
      <button @click="openPalette()" class="hidden sm:flex items-center gap-2 h-9 pl-3 pr-2 rounded-lg bg-white dark:bg-white/5 ring-1 ring-black/10 dark:ring-white/10 text-sm faint hover:ring-brand-500/50 transition">
        <span x-html="icon('search')"></span><span class="hidden lg:inline">Search everything</span><kbd class="kbd" x-text="isMac ? '⌘K' : 'Ctrl K'"></kbd>
      </button>
      <div class="relative flex rounded-xl bg-black/5 dark:bg-white/[.07] p-1 text-xs font-semibold" role="tablist" aria-label="View">
        <span class="absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg bg-white dark:bg-ink-800 shadow-soft transition-all duration-300" :style="{ left: route.dev ? '50%' : '4px' }"></span>
        <a href="#/" role="tab" :aria-selected="!route.dev" class="relative z-10 flex items-center justify-center gap-1.5 w-[4.5rem] sm:w-20 h-7 rounded-lg" :class="route.dev && 'faint'"><span x-html="icon('users', 'w-3.5 h-3.5')"></span>Public</a>
        <a href="#/dev" role="tab" :aria-selected="route.dev" class="relative z-10 flex items-center justify-center gap-1.5 w-[4.5rem] sm:w-20 h-7 rounded-lg" :class="!route.dev && 'faint'">
          <span x-html="icon('code', 'w-3.5 h-3.5')"></span>Dev
          <span x-show="newRequests && !route.dev" class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 grid place-items-center rounded-full bg-brand-500 text-white text-[9px]" x-text="newRequests"></span>
        </a>
      </div>
      <button @click="toggleTheme()" class="w-9 h-9 grid place-items-center rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition" :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'">
        <span x-html="icon(dark ? 'sun' : 'moon', 'w-5 h-5')"></span>
      </button>
    </div>
  </nav>
</header>

<!-- ================= Not served by artisan ================= -->
<template x-if="live === false">
  <main class="page max-w-xl mx-auto px-4 py-20 text-center">
    <div class="mx-auto w-16 h-16 rounded-2xl bg-brand-500 text-white grid place-items-center shadow-glow" x-html="icon('code', 'w-8 h-8')"></div>
    <h1 class="mt-6 h-page">Start the site from the project</h1>
    <p class="mt-3 muted">This page reads the notes in this folder, so it needs the small local server built into artisan. In the project root, run:</p>
    <div class="mt-6 card-sm p-4 font-mono text-sm flex items-center justify-between gap-3">
      <span>artisan ai:site</span>
      <button class="btn-ghost !py-1.5 !px-3" @click="copy('artisan ai:site')"><span x-html="icon('copy')"></span>Copy</button>
    </div>
    <p class="mt-4 text-sm faint">It opens <span class="font-mono">http://127.0.0.1:5173/</span> on this machine only. Nothing is uploaded.</p>
  </main>
</template>

<template x-if="live === null">
  <div class="max-w-6xl mx-auto px-4 py-24 grid place-items-center"><div class="w-8 h-8 rounded-full border-2 border-brand-500 border-t-transparent animate-spin"></div></div>
</template>

<!-- ================= Public: Home ================= -->
<template x-if="live && is('home')">
  <main class="page">
    <section class="relative overflow-hidden">
      <div class="absolute inset-0 dots"></div>
      <div class="absolute -top-48 -right-40 w-[36rem] h-[36rem] rounded-full bg-brand-500/10 dark:bg-brand-500/15 blur-[110px]"></div>
      <div class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-b from-transparent to-ink-50 dark:to-ink-950"></div>
      <div class="relative max-w-6xl mx-auto px-4 pt-14 pb-20 sm:pt-20 grid lg:grid-cols-[1.1fr_1fr] gap-14 items-center">
        <div>
          <a href="#/releases" class="inline-flex items-center gap-2 rounded-full bg-white dark:bg-white/5 ring-1 ring-black/10 dark:ring-white/10 pl-1 pr-3 py-1 text-xs font-medium shadow-soft hover:ring-brand-500/40 transition">
            <span class="rounded-full bg-brand-500 text-white px-2 py-0.5 font-semibold" x-text="'v' + c.latest.version"></span>
            <span x-text="[c.latest.codename, phaseLabel(c.latest.status)].filter(Boolean).join(' · ')"></span>
            <span x-html="icon('right', 'w-3.5 h-3.5', 2.5)"></span>
          </a>
          <h1 class="mt-6 text-[2.75rem] leading-[1.03] sm:text-6xl font-black tracking-tight">
            <span x-text="c.app.name"></span><br><span class="shine">What's new, what's next.</span>
          </h1>
          <p class="mt-6 text-lg muted max-w-lg" x-text="c.app.tagline || 'Releases, what is coming, and a place to send ideas and bugs straight to the team.'"></p>
          <div class="mt-8 flex flex-wrap gap-3">
            <a href="#/releases" class="btn-primary !px-5 !py-3 !text-base" x-text="`What's new in v${c.latest.version}`"></a>
            <a href="#/request" class="btn-ghost !px-5 !py-3 !text-base">Suggest something</a>
          </div>
          <dl class="mt-10 grid grid-cols-3 max-w-md divide-x divide-black/10 dark:divide-white/10">
            <div class="pr-4"><dt class="text-xs faint">Features &amp; changes</dt><dd class="text-3xl font-extrabold mt-1" x-text="c.releaseItems.filter(i => i.kind === 'change').length"></dd></div>
            <div class="px-4"><dt class="text-xs faint">Bugs resolved</dt><dd class="text-3xl font-extrabold mt-1 text-emerald-600 dark:text-emerald-400" x-text="c.releaseItems.filter(i => i.kind === 'fixed' || i.kind === 'verify').length"></dd></div>
            <div class="pl-4"><dt class="text-xs faint" x-text="`Phases in v${c.latest.version}`"></dt><dd class="text-3xl font-extrabold mt-1" x-text="c.latest.phases.length"></dd></div>
          </dl>
        </div>
        <!-- Phone mock: the app's name and areas -->
        <div class="relative mx-auto">
          <div class="relative w-[264px] h-[540px] rounded-[2.6rem] bg-ink-900 dark:bg-black p-2.5 shadow-2xl ring-1 ring-black/10 dark:ring-white/10">
            <div class="absolute top-4 left-1/2 -translate-x-1/2 w-20 h-5 rounded-full bg-black z-10"></div>
            <div class="h-full w-full rounded-[2.1rem] bg-white dark:bg-ink-900 overflow-hidden flex flex-col text-ink-900 dark:text-white">
              <div class="h-9"></div>
              <div class="px-4 flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-brand-500 text-white grid place-items-center text-xs font-black" x-text="(c.app.name || 'A').charAt(0)"></span>
                <span class="font-bold text-sm truncate" x-text="c.app.name"></span>
                <span class="ml-auto opacity-60" x-html="icon('search')"></span>
              </div>
              <div class="mt-4 px-4 grid grid-cols-2 gap-2">
                <template x-for="(a, i) in c.app.areas.filter(a => a !== 'Other' && a !== 'Core').slice(0, 6)" :key="a">
                  <div class="rounded-2xl p-3 text-[11px] font-semibold" :style="{ background: areaColor(a) + '1a', color: areaColor(a) }">
                    <span class="block w-6 h-6 rounded-lg mb-2" :style="{ background: areaColor(a) }"></span><span x-text="a"></span>
                  </div>
                </template>
              </div>
              <div class="mt-auto relative h-16"><span class="absolute right-4 bottom-4 w-11 h-11 rounded-2xl bg-brand-500 text-white grid place-items-center shadow-glow text-xl">+</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 pt-6">
      <p class="eyebrow">What the app offers</p>
      <h2 class="mt-2 h-page">Everything in one app.</h2>
      <div x-show="c.app.features.length" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="f in c.app.features" :key="f.group">
          <article class="group relative card p-6 hover:ring-brand-500/40 transition overflow-hidden">
            <div class="w-11 h-11 rounded-xl bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-400 grid place-items-center group-hover:bg-brand-500 group-hover:text-white group-hover:-rotate-6 transition duration-300" x-html="icon(f.icon || 'sparkle', 'w-6 h-6')"></div>
            <h3 class="mt-4 text-lg font-bold" x-text="f.group"></h3>
            <p class="mt-1 text-sm muted" x-text="f.blurb"></p>
            <ul class="mt-4 flex flex-wrap gap-1.5">
              <template x-for="it in f.items || []" :key="it"><li class="text-xs px-2 py-1 rounded-md bg-ink-100 dark:bg-white/5 group-hover:bg-brand-50 dark:group-hover:bg-brand-500/10 transition" x-text="it"></li></template>
            </ul>
          </article>
        </template>
      </div>
      <div x-show="!c.app.features.length" class="mt-8 card p-6 text-sm muted">
        No feature groups yet. Add them to <code class="font-mono">app.json</code> → <code class="font-mono">features</code>
        (<code class="font-mono">{ "group": "Editor", "icon": "sparkle", "blurb": "…", "items": ["…"] }</code>), or ask an agent to fill them in from the app.
      </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 pt-20">
      <a href="#/releases" class="group card p-6 sm:p-8 flex flex-col md:flex-row md:items-center gap-6 hover:ring-brand-500/40 transition">
        <div class="flex-1 min-w-0">
          <p class="eyebrow">Latest release</p>
          <h3 class="mt-1 text-2xl sm:text-3xl font-black"><span x-text="'v' + c.latest.version"></span> <span class="text-brand-500" x-text="c.latest.codename"></span></h3>
          <p class="mt-2 muted max-w-xl" x-text="c.latest.summary"></p>
          <div class="mt-4 h-2 max-w-md rounded-full bg-ink-100 dark:bg-white/10 overflow-hidden">
            <div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-brand-400" :style="{ width: (c.stats[c.latest.dir]?.progress.pct || 0) + '%' }"></div>
          </div>
        </div>
        <span class="btn-ghost shrink-0">Read the release notes <span x-html="icon('right', 'w-4 h-4', 2.5)"></span></span>
      </a>
    </section>

    <section class="max-w-6xl mx-auto px-4 pt-20 pb-28">
      <p class="eyebrow">Your turn</p>
      <h2 class="mt-2 h-page">Help shape what comes next.</h2>
      <p class="mt-2 muted max-w-xl">No account and no technical knowledge needed. Everything you send lands with the team and shows up here.</p>
      <div class="mt-8 grid md:grid-cols-3 gap-4">
        <template x-for="w in [{ to: '#/request?type=feature', icon: 'sparkle', title: 'Suggest a feature', text: 'Tell us what would make the app better. Plain words, any language.', color: '#8B5CF6' }, { to: '#/request?type=bug', icon: 'bug', title: 'Report a bug', text: 'Something broken? Say where and on which phone; a screenshot helps.', color: '#E11D48' }, { to: '#/soon', icon: 'rocket', title: 'See what’s coming', text: c.coming.length + ' things planned or being fixed right now.', color: '#0EA5E9' }]" :key="w.title">
          <a :href="w.to" class="group card p-6 hover:-translate-y-1 hover:ring-brand-500/40 transition duration-300">
            <span class="w-12 h-12 rounded-2xl grid place-items-center text-white shadow-soft group-hover:scale-110 transition" :style="{ background: w.color }" x-html="icon(w.icon, 'w-6 h-6')"></span>
            <h3 class="mt-4 text-lg font-bold" x-text="w.title"></h3>

                </div>
              </aside>
            </div>
          </template>
        </div>
      </template>

      <!-- ---------- Events ---------- -->
      <template x-if="is('events')">
        <div class="page" x-data="eventsView">
          <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-0">
              <p class="eyebrow font-mono" x-text="c.eventPath"></p>
              <h1 class="mt-1 h-page">Analytics events</h1>
              <p class="mt-2 muted max-w-2xl">Every <span class="font-mono">firebaseEvent</span> the app sends, screen by screen. <span class="font-mono">artisan make:event</span> adds one; <span class="font-mono">artisan check:events</span> compares this list with the code.</p>
            </div>
            <a x-show="c.events.crashlytics" :href="c.events.crashlytics" target="_blank" rel="noopener" class="btn-ghost"><span x-html="icon('bug')"></span>Crashlytics</a>
          </div>
          <div class="sticky top-14 z-20 -mx-4 sm:-mx-6 lg:-mx-8 px-4 sm:px-6 lg:px-8 py-3 mt-4 bg-ink-50/85 dark:bg-ink-950/85 backdrop-blur-xl">
            <label class="relative block">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 faint" x-html="icon('search')"></span>
              <input x-model="search" type="search" :placeholder="`Search ${eventCount} events by name, screen or meaning…`" class="input !pl-9">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs faint" x-text="`${shown} / ${eventCount}`"></span>
            </label>
          </div>
          <div class="mt-2 lg:grid lg:grid-cols-[13rem_1fr] gap-6 items-start">
            <nav class="hidden lg:block sticky top-32 max-h-[calc(100vh-9rem)] overflow-y-auto no-scrollbar">
              <ol class="relative border-l-2 border-brand-500/20 ml-2 space-y-1">
                <template x-for="s in sections" :key="s.i"><li class="relative pl-4"><span class="absolute -left-[5px] top-2 w-2 h-2 rounded-full bg-brand-500"></span><a href="javascript:void 0" @click="jump(s.i)" class="block py-1 text-[13px] muted hover:text-brand-500 leading-snug" x-text="s.title"></a></li></template>
              </ol>
            </nav>
            <div class="space-y-4">
              <template x-for="s in sections" :key="s.i">
                <section :id="'ev-' + s.i" class="card p-5 scroll-mt-32">
                  <h2 class="font-bold leading-snug" x-text="s.title"></h2>
                  <p x-show="s.file" class="text-xs font-mono faint mt-0.5" x-text="s.file"></p>
                  <p x-show="s.intro" class="text-sm muted mt-0.5" x-text="s.intro"></p>
                  <template x-for="g in s.groups" :key="g.label">
                    <div class="mt-4">
                      <p x-show="s.groups.length > 1" class="text-[11px] font-semibold uppercase tracking-wider faint mb-1.5" x-text="g.label"></p>
                      <ul class="divide-y divide-black/5 dark:divide-white/10 rounded-xl ring-1 ring-black/5 dark:ring-white/10 overflow-hidden">
                        <template x-for="r in g.rows" :key="r.event">
                          <li class="grid sm:grid-cols-[minmax(0,15rem)_1fr] gap-x-4 gap-y-0.5 px-3 py-2 bg-white dark:bg-ink-900 hover:bg-ink-50 dark:hover:bg-white/[.03]">
                            <button @click="copyName(r.event)" class="text-left font-mono text-[13px] font-medium text-brand-700 dark:text-brand-300 break-all inline-flex items-start gap-1.5" :title="'Copy ' + r.event">
                              <span x-html="hl(r.event)"></span><span class="mt-0.5 opacity-40" x-html="icon(copied === r.event ? 'check' : 'copy', 'w-3 h-3')"></span>
                            </button>
                            <span class="text-sm muted"><span x-show="r.from" class="font-mono text-xs faint mr-1" x-text="r.from"></span><span x-html="hl(r.when || '—')"></span></span>
                          </li>
                        </template>
                      </ul>
                    </div>
                  </template>
                </section>
              </template>
              <div x-show="!sections.length" class="card p-8 text-center">
                <p class="font-semibold" x-text="search ? `No event matches “${search}”` : 'No events yet'"></p>
                <p class="text-sm faint mt-1">Rows look like <span class="font-mono">| `home_on_create` | onCreate() | Home opened |</span> under a <span class="font-mono">## ScreenName</span> heading.</p>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- Assets ---------- -->
      <template x-if="is('assets')">
        <div class="page" x-data="assetsView">
          <p class="eyebrow font-mono">assets/</p>
          <h1 class="mt-1 h-page">Assets</h1>
          <p class="mt-2 muted max-w-2xl">Screenshots, mockups and videos, each with the notes that link to it. An asset nobody links to is flagged as an orphan.</p>
          <div class="mt-5 flex gap-1.5">
            <template x-for="f in [{ id: 'all', l: 'All', n: c.assets.length }, { id: 'used', l: 'Linked', n: c.assets.length - orphans }, { id: 'orphan', l: 'Orphans', n: orphans }]" :key="f.id">
              <button @click="filter = f.id" class="pill" :class="filter === f.id && 'pill-on'"><span x-text="f.l"></span> <span class="opacity-60" x-text="f.n"></span></button>
            </template>
          </div>
          <div class="mt-5 grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
            <template x-for="a in list" :key="a.path">
              <figure class="card-sm overflow-hidden group">
                <button class="block w-full aspect-[4/3] bg-ink-100 dark:bg-white/5 overflow-hidden" @click="viewing = a">
                  <template x-if="a.video"><video :src="a.url" class="w-full h-full object-cover" muted></video></template>
                  <template x-if="!a.video"><img :src="a.url" :alt="a.name" loading="lazy" class="w-full h-full object-cover object-top group-hover:scale-105 transition duration-500"></template>
                </button>
                <figcaption class="p-3">
                  <p class="font-mono text-xs font-semibold truncate" x-text="a.path"></p>
                  <div class="mt-1.5 flex flex-wrap gap-1">
                    <span x-show="!a.refs.length" class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-700 dark:text-amber-300">Orphan: link it from a note</span>
                    <template x-for="r in a.refs" :key="r"><a :href="routeFor(r)" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-700 dark:text-sky-300 hover:underline truncate max-w-full" x-text="r"></a></template>
                  </div>
                </figcaption>
              </figure>
            </template>
          </div>
          <p x-show="!list.length" class="mt-10 text-center muted">Nothing here. Drop screenshots in <span class="font-mono">assets/</span> and link them from the note they belong to.</p>
          <div x-show="viewing" x-transition.opacity class="fixed inset-0 z-50 bg-ink-950/80 backdrop-blur-sm grid place-items-center p-4" @click.self="viewing = null" @keydown.escape.window="viewing = null">
            <template x-if="viewing">
              <div class="max-w-5xl w-full">
                <template x-if="viewing.video"><video :src="viewing.url" controls autoplay class="w-full max-h-[80vh] rounded-2xl"></video></template>
                <template x-if="!viewing.video"><img :src="viewing.url" :alt="viewing.name" class="mx-auto max-h-[80vh] rounded-2xl shadow-2xl"></template>
                <div class="mt-3 flex items-center justify-between text-white/80 text-sm"><span class="font-mono" x-text="viewing.path"></span><button class="w-9 h-9 grid place-items-center rounded-full bg-white/10 hover:bg-white/20" @click="viewing = null" aria-label="Close" x-html="icon('x')"></button></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ---------- Requests inbox ---------- -->
      <template x-if="is('requests')">
        <div class="page" x-data="requestsInbox">
          <p class="eyebrow font-mono">requests/</p>
          <h1 class="mt-1 h-page">Requests inbox</h1>
          <p class="mt-2 muted max-w-2xl">Feature requests and bug reports sent from the public <a href="#/request" class="text-brand-500 font-semibold">Request</a> page. Changing a status only rewrites the file's front-matter; agents follow <span class="font-mono">requests/README.md</span> to triage.</p>
          <div class="mt-5 flex gap-1.5 overflow-x-auto no-scrollbar">
            <template x-for="ch in chips" :key="ch.id"><button @click="filter = ch.id" class="pill" :class="filter === ch.id && 'pill-on'"><i x-show="ch.color" class="w-1.5 h-1.5 rounded-full" :style="{ background: ch.color }"></i><span x-text="ch.label"></span> <span class="opacity-60" x-text="ch.n"></span></button></template>
          </div>
          <ul class="mt-4 space-y-2">
            <template x-for="r in list" :key="r.id">
              <li :id="'rq-' + r.id" class="card-sm overflow-hidden">
                <button class="w-full text-left p-4 flex items-start gap-3" @click="openId = openId === r.id ? null : r.id">
                  <span class="shrink-0 w-9 h-9 rounded-xl grid place-items-center text-white" :style="{ background: r.type === 'bug' ? '#E11D48' : '#8B5CF6' }" x-html="icon(r.type === 'bug' ? 'bug' : 'sparkle')"></span>
                  <span class="min-w-0 flex-1">
                    <span class="block font-semibold leading-snug" x-text="r.title"></span>
                    <span class="mt-1 flex flex-wrap items-center gap-1.5 text-[11px]">
                      <span class="px-1.5 py-0.5 rounded-md font-semibold" :style="{ background: rst(r.status).color + '1f', color: rst(r.status).color }" x-text="rst(r.status).label"></span>
                      <span x-html="areaBadge(r.area)"></span>
                      <span class="faint" x-text="prettyDate(r.date) + (r.by ? ' · ' + r.by : '')"></span>
                      <span class="faint font-mono" x-text="r.file"></span>
                    </span>
                  </span>
                </button>
                <div class="acc" :class="{ open: openId === r.id }"><div>
                  <div class="px-4 pb-4 sm:pl-16 space-y-3 text-sm">
                    <p x-show="r.text" class="whitespace-pre-line" x-text="r.text"></p>
                    <div class="flex flex-wrap gap-1.5 text-[11px]">
                      <span x-show="r.screen" class="chip" x-text="'Screen: ' + r.screen"></span>
                      <span x-show="r.device" class="chip" x-text="'Device: ' + r.device"></span>
                      <span x-show="r.version" class="chip" x-text="'v' + r.version"></span>
                      <a x-show="r.link" :href="routeFor(r.link)" class="chip font-mono" x-text="r.link"></a>
                    </div>
                    <p x-show="r.reason" class="text-xs"><b>Reason:</b> <span x-text="r.reason"></span></p>
                    <a x-show="r.image" :href="'/' + r.image" target="_blank"><img :src="'/' + r.image" alt="" class="max-h-64 rounded-xl ring-1 ring-black/10"></a>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                      <template x-for="[id, s] in Object.entries(REQUEST_STATUS)" :key="id">
                        <button @click="setStatus(r, id)" :disabled="busy === r.file || r.status === id" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg ring-1 transition disabled:opacity-100"
                                :class="r.status === id ? 'text-white' : 'ring-black/10 dark:ring-white/10 hover:ring-brand-500/50'" :style="r.status === id ? { background: s.color, '--tw-ring-color': s.color } : {}" :title="s.hint" x-text="s.label"></button>
                      </template>
                    </div>
                  </div>
                </div></div>
              </li>
            </template>
          </ul>
          <p x-show="!list.length" class="mt-10 text-center muted">Inbox clear.</p>
        </div>
      </template>

      <!-- ---------- Work reports ---------- -->
      <template x-if="is('reports')">
        <div class="page space-y-6" x-data="reportsView">
          <div>
            <p class="eyebrow font-mono">reports/</p>
            <h1 class="mt-1 h-page">Work reports</h1>
            <p class="mt-2 muted max-w-2xl">One file per day. Each save adds an entry; Export confirms the day's final time and stamps it on the phase heading.</p>
          </div>

          <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="card-sm p-4"><p class="text-xs faint">Last 7 days</p><p class="text-2xl font-extrabold mt-1 text-brand-500" x-text="fmt(sumSince(7))"></p></div>
            <div class="card-sm p-4"><p class="text-xs faint">Last 30 days</p><p class="text-2xl font-extrabold mt-1" x-text="fmt(sumSince(30))"></p></div>
            <div class="card-sm p-4"><p class="text-xs faint">Whole project</p><p class="text-2xl font-extrabold mt-1" x-text="fmt(projectHours)"></p><p class="text-[11px] faint mt-1" x-text="`1 day = ${hm(c.dayMinutes)}`"></p></div>
            <div class="card-sm p-4"><p class="text-xs faint">Entries</p><p class="text-2xl font-extrabold mt-1" x-text="c.reports.reduce((n, r) => n + r.entries.length, 0)"></p></div>
          </section>

          <section class="card p-5">
            <p class="text-xs font-semibold faint mb-3">Last 14 days</p>
            <div class="flex items-end gap-1.5 h-24">
              <template x-for="d in last14" :key="d.iso">
                <a :href="'#/dev/reports?day=' + d.iso" class="flex-1 flex flex-col items-center gap-1 group" :title="prettyDate(d.iso) + ' · ' + fmt(d.h)">
                  <span class="w-full rounded-md transition" :class="d.iso === day ? 'bg-brand-500' : 'bg-brand-500/30 group-hover:bg-brand-500/60'" :style="{ height: Math.max(3, d.pct * 0.8) + 'px' }"></span>
                  <span class="text-[9px] faint" x-text="d.iso.slice(8)"></span>
                </a>
              </template>
            </div>
          </section>

          <div class="grid xl:grid-cols-[1.2fr_1fr] gap-6 items-start">
            <section class="card p-5">
              <div class="flex items-center gap-2">
                <button class="w-8 h-8 grid place-items-center rounded-lg hover:bg-black/5 dark:hover:bg-white/5" @click="step(-1)" aria-label="Previous day" x-html="icon('left')"></button>
                <h2 class="font-bold flex-1 text-center" x-text="prettyDate(day, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })"></h2>
                <button class="w-8 h-8 grid place-items-center rounded-lg hover:bg-black/5 dark:hover:bg-white/5" @click="step(1)" aria-label="Next day" x-html="icon('right')"></button>
              </div>
              <div class="mt-4 rounded-2xl bg-ink-50 dark:bg-white/[.03] ring-1 ring-black/5 dark:ring-white/10 p-4">
                <div class="flex items-center gap-2">
                  <p class="text-xs font-semibold faint flex-1">Daily report</p>
                  <span x-show="c.finalReports[day]" class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-700 dark:text-emerald-300">Final</span>
                  <button class="btn-ghost !py-1 !px-2.5 !text-xs" @click="copy(daily.text, 'Daily report copied')"><span x-html="icon('copy', 'w-3.5 h-3.5')"></span>Copy</button>
                  <button class="btn-primary !py-1 !px-2.5 !text-xs" @click="openExport()"><span x-html="icon('check', 'w-3.5 h-3.5')"></span>Export</button>
                </div>
                <pre class="mt-3 text-xs font-mono whitespace-pre-wrap leading-relaxed" x-text="daily.text"></pre>
              </div>
              <ul class="mt-4 space-y-2">
                <template x-for="e in current?.entries || []" :key="e.id">
                  <li class="rounded-xl p-3 ring-1 ring-black/5 dark:ring-white/10">
                    <div class="flex items-center gap-2"><span class="font-mono text-xs faint" x-text="e.time"></span><span class="font-semibold text-sm flex-1" x-text="e.title"></span><span class="text-xs font-semibold text-brand-500" x-text="fmt(e.hours)"></span></div>
                    <div class="mt-1.5 flex flex-wrap gap-1"><template x-for="a in e.areas" :key="a"><span x-html="areaBadge(a)"></span></template></div>
                    <p x-show="e.text" class="mt-1.5 text-sm muted whitespace-pre-line" x-text="e.text"></p>
                    <p x-show="e.blockers" class="mt-1 text-xs text-rose-600 dark:text-rose-400" x-text="'Blocked: ' + e.blockers"></p>
                  </li>
                </template>
              </ul>
              <p x-show="!current" class="mt-4 text-sm faint text-center">No work logged on this day.</p>
            </section>

            <section class="card p-5">
              <h2 class="font-bold">Add work</h2>
              <form class="mt-4 space-y-4" @submit.prevent="save()">
                <div><label class="label" for="w-title">What did you do? <span class="text-brand-500">*</span></label><input id="w-title" x-model="form.title" maxlength="120" class="input" placeholder="e.g. Fixed the splash freeze"></div>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="label" for="w-date">Day</label><input id="w-date" type="date" x-model="form.date" class="input"></div>
                  <div><label class="label" for="w-time">At</label><input id="w-time" type="time" x-model="form.time" class="input"></div>
                </div>
                <div>
                  <span class="label">How long?</span>
                  <div class="flex items-center gap-2">
                    <input type="number" min="0" max="24" x-model.number="form.h" class="input !w-20" aria-label="Hours"><span class="text-sm faint">h</span>
                    <input type="number" min="0" max="59" step="5" x-model.number="form.m" class="input !w-20" aria-label="Minutes"><span class="text-sm faint">min</span>
                    <template x-for="n in [15, 30, 60]" :key="n"><button type="button" class="chip" @click="addMinutes(n)" x-text="'+' + (n < 60 ? n + 'm' : '1h')"></button></template>
                  </div>
                </div>
                <div>
                  <span class="label">Areas</span>
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="a in c.app.areas" :key="a">
                      <button type="button" @click="toggleArea(a)" class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-lg ring-1 transition" :class="form.areas.includes(a) ? 'ring-2 ring-brand-500 bg-brand-50 dark:bg-brand-500/10' : 'ring-black/10 dark:ring-white/10'">
                        <i class="w-2 h-2 rounded-full" :style="{ background: areaColor(a) }"></i><span x-text="a"></span>
                      </button>
                    </template>
                  </div>
                </div>
                <div><label class="label" for="w-text">Notes <span class="font-normal faint">(optional)</span></label><textarea id="w-text" x-model="form.text" rows="3" class="input resize-y"></textarea></div>
                <button type="button" class="text-xs font-semibold text-brand-500" @click="more = !more" x-text="more ? 'Fewer fields' : 'Links, blockers, name…'"></button>
                <div x-show="more" class="space-y-4">
                  <div>
                    <label class="label" for="w-link">Links to notes</label>
                    <div class="flex gap-2"><input id="w-link" list="w-links" x-model="form.link" class="input font-mono !text-xs" placeholder="workflow/v_1_0/phase_1.md" @keydown.enter.prevent="addLink()"><button type="button" class="btn-ghost" @click="addLink()">Add</button></div>
                    <datalist id="w-links"><template x-for="l in linkOptions" :key="l"><option :value="l"></option></template></datalist>
                    <div class="mt-2 flex flex-wrap gap-1"><template x-for="(l, i) in form.links" :key="l"><button type="button" class="chip font-mono" @click="form.links.splice(i, 1)"><span x-text="l"></span><span x-html="icon('x', 'w-3 h-3')"></span></button></template></div>
                  </div>
                  <div><label class="label" for="w-block">Blockers</label><input id="w-block" x-model="form.blockers" class="input"></div>
                  <div><label class="label" for="w-by">Your name</label><input id="w-by" x-model="form.by" class="input"></div>
                </div>
                <p x-show="error" class="text-sm text-brand-600 dark:text-brand-400 font-medium" x-text="error"></p>
                <button type="submit" class="btn-primary w-full" :disabled="saving"><span x-html="icon('plus')"></span><span x-text="saving ? 'Saving…' : `Save · ${hm(formMinutes)}`"></span></button>
              </form>
            </section>
          </div>

          <!-- Export → Confirm -->
          <div x-show="exp.open" x-transition.opacity class="fixed inset-0 z-50 bg-ink-950/70 backdrop-blur-sm grid place-items-center p-4" @click.self="!exp.saving && (exp.open = false)" @keydown.escape.window="!exp.saving && (exp.open = false)">
            <div class="card w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
              <h2 class="text-xl font-extrabold">Final report · <span x-text="prettyDate(day)"></span></h2>
              <p class="mt-1 text-sm muted">Saves <span class="font-mono" x-text="`reports/final/${day}.md`"></span>.</p>
              <div class="mt-4 flex flex-wrap items-center gap-2">
                <span class="label !mb-0">Time worked</span>
                <input type="number" min="0" max="24" x-model.number="exp.h" class="input !w-20"><span class="text-sm faint">h</span>
                <input type="number" min="0" max="59" step="5" x-model.number="exp.m" class="input !w-20"><span class="text-sm faint">min</span>
                <span class="text-xs faint" x-text="`logged: ${hm(loggedMin)}`"></span>
              </div>
              <label x-show="headings.length" class="mt-3 flex items-start gap-2 text-sm"><input type="checkbox" x-model="exp.stamp" class="mt-1 accent-brand-500"><span>Stamp <b x-text="`[${hm(expMinutes)}]`"></b> on the day's heading in <span class="font-mono text-xs" x-text="headings.map(h => h.path).join(', ')"></span></span></label>
              <label x-show="extraMin" class="mt-2 flex items-start gap-2 text-sm"><input type="checkbox" x-model="exp.addExtra" class="mt-1 accent-brand-500"><span>Also log the <b x-text="hm(extraMin)"></b> not yet in work entries</span></label>
              <input x-show="exp.addExtra && extraMin" x-model="exp.addTitle" class="input mt-2" placeholder="Other work (added at final report)">
              <textarea x-model="exp.text" @input="exp.edited = true" rows="12" class="input mt-4 font-mono !text-xs"></textarea>
              <p x-show="exp.error" class="mt-2 text-sm text-brand-600 font-medium" x-text="exp.error"></p>
              <div class="mt-4 flex flex-wrap justify-end gap-2">
                <button class="btn-ghost" @click="copy(exp.text, 'Copied')"><span x-html="icon('copy')"></span>Copy</button>
                <button class="btn-ghost" @click="exp.open = false" :disabled="exp.saving">Cancel</button>
                <button class="btn-primary" @click="confirmExport()" :disabled="exp.saving"><span x-html="icon('check')"></span><span x-text="exp.saving ? 'Saving…' : 'Confirm'"></span></button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- Agent guide ---------- -->
      <template x-if="is('guide')">
        <div class="page">
          <p class="eyebrow font-mono">README.md</p>
          <h1 class="mt-1 h-page">Agent guide</h1>
          <article class="md-body mt-6 card p-6 sm:p-8" x-html="md(c.readme, 'README.md')"></article>
        </div>
      </template>
    </div>
  </div>
</template>

<!-- ================= Footer + mobile tab bar ================= -->
<footer x-show="live && !route.dev" class="border-t border-black/5 dark:border-white/10">
  <div class="max-w-6xl mx-auto px-4 pt-8 pb-32 md:pb-8 flex flex-col sm:flex-row gap-2 sm:items-center justify-between text-sm faint">
    <span><span x-text="c.app.name"></span> · <span class="font-mono" x-text="c.app.packageId"></span></span>
    <span>Built from the <code class="font-mono">ai/</code> workspace. Local only, never shipped with the app.</span>
  </div>
</footer>

<nav x-show="live && !route.dev" class="md:hidden fixed bottom-4 inset-x-4 z-40 liquid rounded-[1.6rem] p-1.5 grid grid-cols-4">
  <template x-for="t in [{ to: '#/', v: 'home', l: 'Home', i: 'home' }, { to: '#/releases', v: 'releases', l: 'Releases', i: 'history' }, { to: '#/soon', v: 'soon', l: 'Soon', i: 'rocket' }, { to: '#/request', v: 'request', l: 'Request', i: 'inbox' }]" :key="t.v">
    <a :href="t.to" class="relative flex flex-col items-center gap-0.5 py-1.5 rounded-2xl text-[10px] font-semibold transition" :class="is(t.v) ? 'bg-white/70 dark:bg-white/10 text-brand-600 dark:text-brand-400' : 'muted'">
      <span x-html="icon(t.i, 'w-5 h-5')"></span><span x-text="t.l"></span>
    </a>
  </template>
</nav>

<!-- ================= Search palette ================= -->
<div x-show="pal.open" x-transition.opacity class="fixed inset-0 z-[60] bg-ink-950/50 backdrop-blur-sm flex items-start justify-center p-4 pt-[12vh]" @click.self="pal.open = false">
  <div class="card w-full max-w-xl overflow-hidden">
    <label class="flex items-center gap-3 px-4 border-b border-black/5 dark:border-white/10">
      <span class="faint" x-html="icon('search', 'w-5 h-5')"></span>
      <input id="pal-input" x-model="pal.q" @input="pal.sel = 0" @keydown="palKey($event)" class="flex-1 h-14 bg-transparent outline-none text-base" placeholder="Search pages, plans, checklist items, events…" autocomplete="off">
      <kbd class="kbd">Esc</kbd>
    </label>
    <ul class="max-h-[55vh] overflow-y-auto p-2">
      <template x-for="(r, i) in palResults" :key="r.kind + r.to + i">
        <li><a :href="r.to" @mouseenter="pal.sel = i" class="flex items-center gap-3 rounded-xl px-3 py-2.5" :class="pal.sel === i && 'bg-brand-500/10'">
          <span class="w-8 h-8 rounded-lg bg-ink-100 dark:bg-white/10 grid place-items-center shrink-0" x-html="icon(r.icon)"></span>
          <span class="min-w-0 flex-1"><span class="block text-sm font-semibold truncate" :class="r.mono && 'font-mono'" x-text="r.title"></span><span class="block text-xs faint truncate" x-text="r.sub"></span></span>
          <span class="text-[10px] font-semibold faint shrink-0" x-text="r.kind"></span>
        </a></li>
      </template>
      <li x-show="!palResults.length" class="px-3 py-8 text-center text-sm faint">Nothing found.</li>
    </ul>
  </div>
</div>

<!-- ================= Toast ================= -->
<div x-show="toast" x-transition class="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-[70] rounded-xl bg-ink-900 text-white dark:bg-white dark:text-ink-900 px-4 py-2.5 text-sm font-medium shadow-2xl max-w-[90vw]" x-text="toast"></div>

</body>
</html>
