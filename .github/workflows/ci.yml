name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew test installDist --console=plain
      - name: Smoke test
        shell: bash
        run: |
          bin=build/install/kotlin-artisan/bin
          if [ "$RUNNER_OS" = "Windows" ]; then "$bin/artisan.bat" list; else "$bin/artisan" list; fi
