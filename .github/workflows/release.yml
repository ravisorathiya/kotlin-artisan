name: Release

# Push a tag like v0.1.0 -> builds the distribution zip and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        run: |
          v=$(grep -E '^version = ' build.gradle.kts | sed -E 's/version = "(.*)"/\1/')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != version $v in build.gradle.kts"; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: PowerShell 7 predictor
        shell: pwsh
        run: |
          dotnet publish predictor -c Release -o predictor/bin/Release/publish
          ./predictor/smoke-test.ps1 -Dll ./predictor/bin/Release/publish/ArtisanPredictor.dll
      - name: Build
        run: ./gradlew test distZip --console=plain
      - name: The zip carries the predictor
        run: unzip -l build/distributions/*.zip | grep -q 'predictor/ArtisanPredictor.dll'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
